name: Checks and Windows package
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test installer and desktop integration
        shell: python
        run: |
          import os, sys, unittest
          sys.path.insert(0, os.getcwd())
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests'))
          for test, traceback in result.errors + result.failures:
              message = (str(test) + '\n' + traceback).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + message, flush=True)
          sys.exit(0 if result.wasSuccessful() else 1)
      - name: Package Windows companion
        if: runner.os == 'Windows'
        run: |
          python -m pip install pyinstaller==6.12.0
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name VoiceBridge main.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: VoiceBridge-Windows
          path: dist/VoiceBridge.exe
